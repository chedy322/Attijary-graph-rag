<div class="app-layout">
  @if (apiErrorService.message(); as message) {
    <div class="global-error-container" aria-live="polite">
      <div class="global-error" role="alert">
        <span>{{ message }}</span>
        <button type="button" (click)="apiErrorService.clear()" aria-label="Dismiss error">&times;</button>
      </div>
    </div>
  }
  @if (!isAuthPage) {
    <header class="mobile-header">
      <button type="button" class="mobile-menu-button" (click)="toggleMobileSidebar()" aria-label="Open navigation menu">
        &#9776;
      </button>
      <span>Central Bank</span>
    </header>
    @if (isMobileSidebarOpen) {
      <button type="button" class="mobile-sidebar-backdrop" (click)="closeMobileSidebar()" aria-label="Close navigation menu"></button>
    }
    <app-sidebar
      [userRole]="currentUserRole"
      [isCollapsed]="isSidebarCollapsed"
      [mobileOpen]="isMobileSidebarOpen"
      (toggleCollapse)="onToggleSidebar()"
      (closeMobileSidebar)="closeMobileSidebar()"
    ></app-sidebar>
  }

  <main class="main-content" [class.full-width]="isAuthPage">
    <router-outlet></router-outlet>
  </main>
</div>
