# Run on every pull request on every branch
on:
  pull_request:
      branches:
        - main
      paths:
        - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Run ,depandabot bot,secret scanning ,unit test ,Intergration test,security test
jobs:

  secret-scanning:
    uses: ./.github/workflows/reusable-secret-scanning.yml
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Run Security test
  codeql-analysis:
    uses: ./.github/workflows/reusable-codeQl-scanning.yml
    with:
      languages: 'javascript-typescript'
      scan-path: 'frontend'
  # Run Docker build and scan without deploying to registry
  docker-build-and-scan:
    uses: ./.github/workflows/docker-build-image.yml
    with:
      image_name: 'graphrag-frontend'
      dockerfile_path: 'frontend/Dockerfile'
      image_tag: frontend-pr-${{ github.event.pull_request.number }}
      context: 'frontend'
      push_image: false
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
