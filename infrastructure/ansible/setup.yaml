---
- name: Install Docker and Configure Nginx Reverse Proxy
  hosts: all
  become: true
  vars:
    backend_port: 5000
    server_domain: "_"  # Replace with your domain name or IP address if needed

  tasks:
    # -------------------------------------------------------------
    # 1. Install Dependencies & Docker (Ubuntu / Debian)
    # -------------------------------------------------------------
    - name: Update apt cache and install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - nginx
        state: present
        update_cache: true

    - name: Create directory for Docker keyring
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: >-
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker Engine and Docker Compose Plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and started
      systemd:
        name: docker
        state: started
        enabled: true

    # -------------------------------------------------------------
    # 2. Configure Nginx Reverse Proxy to Container
    # -------------------------------------------------------------
    - name: Create Nginx virtual host configuration
      copy:
        dest: /etc/nginx/sites-available/backend_proxy
        content: |
          server {
              listen 80;
              server_name {{ server_domain }};

              location / {
                  proxy_pass http://127.0.0.1:{{ backend_port }};
                  proxy_http_version 1.1;

                  # Standard headers for reverse proxying Flask apps
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }
          }
        mode: '0644'
      notify: Reload Nginx

    - name: Enable Nginx virtual host configuration
      file:
        src: /etc/nginx/sites-available/backend_proxy
        dest: /etc/nginx/sites-enabled/backend_proxy
        state: link
      notify: Reload Nginx

    - name: Remove default Nginx site configuration
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Ensure Nginx service is enabled and started
      systemd:
        name: nginx
        state: started
        enabled: true

  # -------------------------------------------------------------
  # Handlers
  # -------------------------------------------------------------
  handlers:
    - name: Reload Nginx
      systemd:
        name: nginx
        state: reloaded